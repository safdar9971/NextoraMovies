<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nextora Movies</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:#fff;
}

header{
position:fixed;
top:0;
width:100%;
background:rgba(0,0,0,0.9);
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
z-index:1000;
}

.logo{
font-size:32px;
font-weight:bold;
color:#e50914;
}

nav a{
color:white;
text-decoration:none;
margin:0 12px;
}

.search-box input{
padding:8px;
border:none;
border-radius:4px;
}

.hero{
height:100vh;
background:url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1600') center/cover;
display:flex;
align-items:center;
padding:60px;
}

.hero-content{
max-width:600px;
background:rgba(0,0,0,0.6);
padding:30px;
border-radius:10px;
}

.hero h1{
font-size:60px;
margin-bottom:15px;
}

.hero p{
margin-bottom:20px;
line-height:1.6;
}

.btn{
background:#e50914;
padding:12px 25px;
color:white;
text-decoration:none;
border-radius:5px;
display:inline-block;
}

.section{
padding:40px;
}

.section h2{
margin-bottom:20px;
}

.movie-row{
display:flex;
overflow-x:auto;
gap:15px;
}

.movie-row::-webkit-scrollbar{
display:none;
}

.card{
min-width:220px;
background:#222;
border-radius:8px;
overflow:hidden;
transition:.3s;
}

.card:hover{
transform:scale(1.05);
}

.card img{
width:100%;
height:320px;
object-fit:cover;
}

.card h3{
padding:12px;
font-size:18px;
}

.player{
padding:40px;
}

.player iframe{
width:100%;
height:600px;
border:none;
}

footer{
background:#000;
padding:25px;
text-align:center;
margin-top:40px;
}

@media(max-width:768px){
.hero h1{
font-size:40px;
}
.player iframe{
height:250px;
}
header{
flex-direction:column;
gap:10px;
}
}
</style>
</head>
<body>

<header>
<div class="logo">NEXTORA MOVIES</div>

<nav>
<a href="#">Home</a>
<a href="#movies">Movies</a>
<a href="#watch">Watch</a>
<a href="#contact">Contact</a>
</nav>

<div class="search-box">
<input type="text" placeholder="Search Movies">
</div>
</header>

<section class="hero">
<div class="hero-content">
<h1>Unlimited Movies & Entertainment</h1>
<p>Watch your favorite movies online anytime, anywhere.</p>
<a href="#watch" class="btn">Watch Now</a>
</div>
</section>

<section class="section" id="movies">
<h2>Trending Movies</h2>

<div class="movie-row">

<div class="card">
<img src="https://picsum.photos/300/450?1">
<h3>Movie One</h3>
</div>

<div class="card">
<img src="https://picsum.photos/300/450?2">
<h3>Movie Two</h3>
</div>

<div class="card">
<img src="https://picsum.photos/300/450?3">
<h3>Movie Three</h3>
</div>

<div class="card">
<img src="https://picsum.photos/300/450?4">
<h3>Movie Four</h3>
</div>

<div class="card">
<img src="https://picsum.photos/300/450?5">
<h3>Movie Five</h3>
</div>

</div>
</section>

<section class="player" id="watch">
<h2>Featured Movie</h2>

<iframe
src="https://www.youtube.com/embed/dQw4w9WgXcQ"
allowfullscreen>
</iframe>

</section>

<footer id="contact">
<h3>Contact Us</h3>
<p>Email: your@email.com</p>
<p>© 2026 Nextora Movies</p>
</footer>

</body>
</html>
